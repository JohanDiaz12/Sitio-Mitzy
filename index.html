<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Portal · Mitzy Lafragua</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <!-- Librería oficial de Supabase (versión fija) + configuración del proyecto -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
        <script src="supabase-config.js"></script>
    </head>
    <body>
        <nav>
            <a href="index.html" class="activo">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="acerca.html">Acerca de mí</a>
        </nav>

        <!-- ===================== HÉROE + LOGIN (sin sesión) ===================== -->
        <main id="login" class="heroe">
            <div>
                <span class="etiqueta">Portal seguro · Módulo 1</span>
                <h1>Hola, esta es mi primer página web</h1>
                <h2>Hola, soy <strong>Mitzy Fernanda Lafragua Vargas</strong> y es mi primera página.</h2>
            </div>

            <section class="card">
                <h3>Inicia sesión</h3>
                <label for="email">Correo</label>
                <input id="email" type="email" placeholder="usuario@ejemplo.com" autocomplete="username">
                <label for="pass">Contraseña</label>
                <input id="pass" type="password" placeholder="mínimo 6 caracteres" autocomplete="current-password">
                <div class="acciones">
                    <button id="btn-entrar" onclick="entrar()">Entrar</button>
                    <button id="btn-registrar" class="fantasma" onclick="registrar()">Crear cuenta</button>
                </div>
                <div class="separador">o sin contraseña</div>
                <div class="acciones">
                    <button id="btn-enlace" class="enlace" onclick="enviarEnlace()">Enviar enlace de acceso al correo</button>
                </div>
                <p id="m1" class="msg"></p>
            </section>
        </main>

        <!-- ===================== PANEL (solo con sesión) ===================== -->
        <section id="app" class="card ancho" hidden>
            <div class="barra">
                <span class="chip" id="usuario"></span>
                <button id="btn-salir" class="fantasma" onclick="salir()">Cerrar sesión</button>
            </div>

            <div class="columnas">
                <div>
                    <h3>Nueva solicitud</h3>
                    <label for="titulo">Título</label>
                    <input id="titulo" type="text" placeholder="ej: Compra de material">
                    <label for="monto">Monto</label>
                    <input id="monto" type="number" min="0" step="0.01" placeholder="0.00">
                    <div class="acciones">
                        <button id="btn-guardar" onclick="crearSolicitud()">Guardar solicitud</button>
                    </div>
                    <p id="m2" class="msg"></p>
                </div>
                <div>
                    <h3>Solicitudes</h3>
                    <!-- Módulo 1: se ven las de todos. Cada quien solo las suyas = Módulo 4 -->
                    <ul id="lista"></ul>
                </div>
            </div>
        </section>

        <script>
            // ---------- utilidades ----------
            // Lee y limpia el valor de un input
            const val = id => document.getElementById(id).value.trim();

            // Muestra un mensaje de éxito (ok=true) o error (ok=false)
            function msg(id, texto, ok){
                const el = document.getElementById(id);
                el.textContent = texto;
                el.className = 'msg ' + (ok ? 'ok' : 'error');
            }

            // Alterna entre login y panel
            function mostrarLogin(){
                document.getElementById('app').hidden = true;
                document.getElementById('login').hidden = false;
                document.getElementById('pass').value = '';
            }
            async function mostrarApp(){
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return mostrarLogin();          // sesión inválida/expirada
                document.getElementById('usuario').textContent = user.email;
                document.getElementById('login').hidden = true;
                document.getElementById('app').hidden = false;
                cargarSolicitudes();
            }

            // ---------- Registro e inicio de sesión con Supabase Auth ----------
            async function registrar(){
                const { error } = await supabase.auth.signUp({ email: val('email'), password: val('pass') });
                if (error) return msg('m1', 'Error: ' + error.message, false);
                msg('m1', 'Cuenta creada. Ya puedes iniciar sesión.', true);
            }
            async function entrar(){
                const { error } = await supabase.auth.signInWithPassword({ email: val('email'), password: val('pass') });
                // Mensaje genérico: no revela si el correo existe o no
                if (error) return msg('m1', 'Credenciales incorrectas', false);
                msg('m1', '', true);
                mostrarApp();
            }

            // ---------- Acceso por enlace al correo (magic link) ----------
            // Supabase envía un correo con un enlace; al abrirlo vuelve a esta misma página ya con sesión
            async function enviarEnlace(){
                const email = val('email');
                if (!email) return msg('m1', 'Escribe tu correo', false);
                const { error } = await supabase.auth.signInWithOtp({
                    email,
                    options: { emailRedirectTo: location.origin + location.pathname }
                });
                if (error) return msg('m1', 'Error: ' + error.message, false);
                msg('m1', 'Enlace enviado. Revisa tu correo (y la carpeta de spam).', true);
            }

            // Al volver desde el enlace del correo, Supabase crea la sesión y avisa aquí
            supabase.auth.onAuthStateChange((evento) => {
                if (evento === 'SIGNED_IN' && document.getElementById('app').hidden) mostrarApp();
            });

            // ---------- Solicitudes: guardan el correo del usuario ----------
            async function crearSolicitud(){
                const titulo = val('titulo');
                const monto = Number(val('monto'));
                if (!titulo || !(monto >= 0) || val('monto') === '') return msg('m2', 'Escribe título y monto válido', false);

                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return mostrarLogin();
                const { error } = await supabase.from('solicitudes').insert({ titulo, monto, usuario_email: user.email });
                if (error) return msg('m2', 'Error: ' + error.message, false);

                msg('m2', 'Solicitud guardada', true);
                document.getElementById('titulo').value = '';
                document.getElementById('monto').value = '';
                cargarSolicitudes();
            }

            // Pinta la lista con textContent (no innerHTML) para evitar inyección de HTML/JS
            async function cargarSolicitudes(){
                const { data, error } = await supabase.from('solicitudes')
                    .select('titulo, monto, usuario_email').order('id', { ascending: false });
                const lista = document.getElementById('lista');
                lista.replaceChildren();
                if (error) return msg('m2', 'Error al cargar: ' + error.message, false);
                if (!data.length) {
                    const li = document.createElement('li');
                    li.className = 'vacio';
                    li.textContent = 'Aún no hay solicitudes.';
                    return lista.appendChild(li);
                }
                for (const s of data) {
                    const li = document.createElement('li');
                    const partes = [
                        ['titulo', s.titulo],
                        ['monto', '$' + Number(s.monto).toFixed(2)],
                        ['autor', s.usuario_email ?? '—'],
                    ];
                    for (const [clase, texto] of partes) {
                        const span = document.createElement('span');
                        span.className = clase;
                        span.textContent = texto;
                        li.appendChild(span);
                    }
                    lista.appendChild(li);
                }
            }

            // ---------- Cerrar sesión ----------
            async function salir(){
                await supabase.auth.signOut();
                document.getElementById('lista').replaceChildren();
                mostrarLogin();
            }

            // ---------- Al cargar: si ya hay sesión se entra directo ----------
            (async () => {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) mostrarApp();
            })();
        </script>
    </body>
</html>
